services:
  datalake-db:
    image: postgres:16
    container_name: aps-datalake-db
    environment:
      POSTGRES_DB: datalake
      POSTGRES_USER: ${DATALAKE_USER}
      POSTGRES_PASSWORD: ${DATALAKE_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - datalake_data:/var/lib/postgresql/data

  superset:
    build: ../superset
    image: aps-superset:4.1.1
    container_name: aps-superset
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    ports:
      - "8089:8088"
    volumes:
      - superset_home:/app/superset_home
    depends_on:
      - datalake-db

volumes:
  datalake_data:
  superset_home:
